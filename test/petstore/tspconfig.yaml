emit:
  - "@kattebak/typespec-opensearch-emitter"
options:
  "@kattebak/typespec-opensearch-emitter":
    emitter-output-dir: "{cwd}/build/petstore-emit"
    package-name: "@kattebak/petstore-rest"
    package-version: "0.0.1"
    graphql:
      emit: true
    rest:
      dataSourceName: "HTTP"
      injectHeaders:
        x-user-id: "identity.resolverContext.userId"
