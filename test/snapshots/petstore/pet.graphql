type Pet {
  petId: String!
  name: String!
  status: PetStatus!
  createdAt: Float!
}

enum PetStatus {
  Available
  Pending
  Sold
}

input CreatePetInput {
  name: String!
  status: PetStatus!
  createdAt: Float!
}

type Query {
  getPet(petId: String!): Pet
  listPets(status: String): [Pet!]
}

type Mutation {
  createPet(input: CreatePetInput!): Pet
}
